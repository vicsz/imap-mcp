name: Go

on:
  push:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/go.yml
  pull_request:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/go.yml

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: |
          files="$(gofmt -l $(find . -type f -name '*.go'))"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
